name: V2 Python Engine CI

on:
  pull_request:
    paths:
      - "stock_v2_public/**"
      - "schemas/technical_pattern_packet.schema.json"
      - "schemas/candlestick_pattern_event.schema.json"
      - "THIRD_PARTY_NOTICES.md"
      - "generate_v2.py"
      - "requirements-v2.lock"
      - "tools/test_generate_v2.py"
      - "tools/test_v2_engine.py"
      - "tools/test_viewport_master.py"
      - "tools/test_candlestick_annotations.py"
      - "tools/verify_daily_update_artifacts.py"
      - "tools/test_verify_daily_update_artifacts.py"
      - "tools/verify_v2_public.py"
      - "tools/test_verify_v2_public.py"
      - ".github/workflows/daily_update.yml"
      - ".github/workflows/v2-ci.yml"
  push:
    branches: [main]
    paths:
      - "stock_v2_public/**"
      - "schemas/technical_pattern_packet.schema.json"
      - "schemas/candlestick_pattern_event.schema.json"
      - "THIRD_PARTY_NOTICES.md"
      - "generate_v2.py"
      - "requirements-v2.lock"
      - "tools/test_generate_v2.py"
      - "tools/test_v2_engine.py"
      - "tools/test_viewport_master.py"
      - "tools/test_candlestick_annotations.py"
      - "tools/verify_daily_update_artifacts.py"
      - "tools/test_verify_daily_update_artifacts.py"
      - "tools/verify_v2_public.py"
      - "tools/test_verify_v2_public.py"
      - ".github/workflows/daily_update.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-v2.lock
      - run: python -m unittest tools.test_generate_v2 tools.test_v2_engine tools.test_viewport_master tools.test_candlestick_annotations tools.test_verify_daily_update_artifacts tools.test_verify_v2_public -v
      - run: python generate_v2.py --only 2353 --validate
      - shell: python
        run: |
          import json
          from pathlib import Path
          packets = json.loads(Path("docs/v2/data/2353.json").read_text(encoding="utf-8"))
          daily = next(packet for packet in packets if packet["timeframe"] == "daily")
          assert "decision" not in daily
          annotations = daily["candlestick_annotations"]
          assert annotations["timeframe"] == "1d"
          assert annotations["talib"]["pattern_function_count"] == 61
          assert all(event["bar_status"] == "closed" for event in annotations["events"])
          risk = daily["risk_control"]
          assert risk["stop_loss_pct"] == 15.0
          assert risk["stop_price"] == round(risk["reference_price"] * 0.85, 4)
          assert all(set(line["start"]) == {"date", "price"} for line in daily["trendlines"])
