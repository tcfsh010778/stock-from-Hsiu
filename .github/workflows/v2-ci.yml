jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-v2.lock pytest requests
      - run: python -m unittest tools.test_generate_v2 tools.test_v2_engine tools.test_viewport_master tools.test_candlestick_annotations tools.test_verify_daily_update_artifacts tools.test_verify_v2_public -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pytest tools/test_workspace.py tools/test_review_queue.py tools/test_build_review_data.py tools/test_review_home.py tools/test_sfz_review.py tools/test_sfz_universe.py tools/test_mda_checklist.py tools/test_mda_weekly_pipeline.py tools/test_verified_price_guard.py tools/test_public_history_contract.py tools/test_import_verified_price_batch.py tools/test_market_reference_integrity.py tools/test_official_adjusted_history.py tools/test_update_weekly_mda_pool.py tools/test_build_official_stock_universe.py tools/test_update_weekly_sources.py tools/test_verify_holder_flow.py tools/test_daily_session_integrity.py tools/test_market_flow.py tools/test_official_workbench.py tools/test_workbench_integration.py tools/test_resolve_verified_session.py tools/test_publish_pages_verified.py -q
      - shell: python
        run: |
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import sys
          sys.path.insert(0, str(Path.cwd()))
          from generate_v2 import analyze_stock_task
          from tools.test_public_history_contract import fixture
          with TemporaryDirectory() as temporary:
              data_dir = Path(temporary)
              fixture(data_dir, 520, sid="9001")
              args = ("9001", "Synthetic", data_dir / "prices" / "9001.csv", data_dir, {}, "fresh", "2026-09-04", [], True)
              stock_id, name, packets, error = analyze_stock_task(args)
          assert error is None, error
          assert stock_id == "9001" and name == "Synthetic"
          daily = next(packet for packet in packets if packet["timeframe"] == "daily")
          assert daily["data_date"] == "2026-09-04"
          assert len(daily["series"]) == 240
          assert daily["series"][0]["sma240"] is not None
          assert "decision" not in daily
          annotations = daily["candlestick_annotations"]
          assert annotations["timeframe"] == "1d"
          assert annotations["talib"]["pattern_function_count"] == 61
          assert all(event["bar_status"] == "closed" for event in annotations["events"])
          risk = daily["risk_control"]
          assert risk["stop_loss_pct"] == 15.0
          assert risk["stop_price"] == round(risk["reference_price"] * 0.85, 4)
          assert all(set(line["start"]) == {"date", "price"} for line in daily["trendlines"])
