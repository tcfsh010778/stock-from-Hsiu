name: V2 Python Engine CI

on:
  pull_request:
    paths:
      - "stock_v2_public/**"
      - "official_price_refresh.py"
      - "official_chip_history.py"
      - "market_flow.py"
      - "refresh_prices.py"
      - "tools/test_*"
      - "tools/collect_volume_profile.py"
      - "tools/refresh_v2_chip_panels.py"
      - "schemas/technical_pattern_packet.schema.json"
      - "schemas/candlestick_pattern_event.schema.json"
      - "THIRD_PARTY_NOTICES.md"
      - "generate_v2.py"
      - "requirements-v2.lock"
      - "tools/test_generate_v2.py"
      - "tools/test_v2_engine.py"
      - "tools/test_viewport_master.py"
      - "tools/test_candlestick_annotations.py"
      - "tools/verify_daily_update_artifacts.py"
      - "tools/test_verify_daily_update_artifacts.py"
      - "tools/verify_v2_public.py"
      - "tools/test_verify_v2_public.py"
      - ".github/workflows/daily_update.yml"
      - ".github/workflows/v2-ci.yml"
  push:
    branches: [main]
    paths:
      - "stock_v2_public/**"
      - "official_price_refresh.py"
      - "official_chip_history.py"
      - "market_flow.py"
      - "refresh_prices.py"
      - "tools/test_*"
      - "tools/collect_volume_profile.py"
      - "tools/refresh_v2_chip_panels.py"
      - "schemas/technical_pattern_packet.schema.json"
      - "schemas/candlestick_pattern_event.schema.json"
      - "THIRD_PARTY_NOTICES.md"
      - "generate_v2.py"
      - "requirements-v2.lock"
      - "tools/test_generate_v2.py"
      - "tools/test_v2_engine.py"
      - "tools/test_viewport_master.py"
      - "tools/test_candlestick_annotations.py"
      - "tools/verify_daily_update_artifacts.py"
      - "tools/test_verify_daily_update_artifacts.py"
      - "tools/verify_v2_public.py"
      - "tools/test_verify_v2_public.py"
      - ".github/workflows/daily_update.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-v2.lock requests
      - run: python -m unittest tools.test_generate_v2 tools.test_v2_engine tools.test_viewport_master tools.test_candlestick_annotations tools.test_verify_daily_update_artifacts tools.test_verify_v2_public -v
      - run: python -m unittest tools.test_v2_history_contract tools.test_official_price_refresh tools.test_price_basis tools.test_market_flow tools.test_official_chip_history tools.test_collect_volume_profile tools.test_refresh_prices_migration_preflight tools.test_verify_v2_daily_artifacts tools.test_official_source_gate -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/test_volume_profile.cjs
      - shell: python
        run: |
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from stock_v2_public.site import V2_JS
          with tempfile.TemporaryDirectory() as folder:
              path = Path(folder) / "v2.js"
              path.write_text(V2_JS, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
