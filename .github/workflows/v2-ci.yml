name: V2 Python Engine CI

on:
  pull_request:
    paths:
      - "stock_v2_public/**"
      - "schemas/technical_pattern_packet.schema.json"
      - "generate_v2.py"
      - "requirements-v2.lock"
      - "tools/test_generate_v2.py"
      - "tools/test_v2_engine.py"
      - ".github/workflows/v2-ci.yml"
  push:
    branches: [main]
    paths:
      - "stock_v2_public/**"
      - "schemas/technical_pattern_packet.schema.json"
      - "generate_v2.py"
      - "requirements-v2.lock"
      - "tools/test_generate_v2.py"
      - "tools/test_v2_engine.py"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-v2.lock
      - run: python -m unittest tools.test_generate_v2 tools.test_v2_engine -v
      - run: python generate_v2.py --only 2353 --validate
      - shell: python
        run: |
          import json
          from pathlib import Path
          packets = json.loads(Path("docs/v2/data/2353.json").read_text(encoding="utf-8"))
          daily = next(packet for packet in packets if packet["timeframe"] == "daily")
          assert daily["decision"]["action_state"] == "SETUP"
          assert all(set(line["start"]) == {"date", "price"} for line in daily["trendlines"])
