name: Publish Human Review Home

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,13 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'build_review_data.py'
      - 'review_queue.py'
      - 'review_home.py'
      - 'stock_v2_public/analysis/sfz_review.py'
      - '.github/workflows/review_home_publish.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-stock-site-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v2.lock
      - name: Sync latest generated data
        run: git pull --ff-only origin main
      - name: Build independent observations and compare durable state
        run: python build_review_data.py
      - name: Build only review homepage and supporting pages
        run: python generate_site.py --review-only
      - name: Verify source gates and publication semantics
        run: python tools/verify_review_home.py
      - name: Commit scoped public results
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/review_queue.json data/sfz_technical_candidates.json docs/data/review_queue.json docs/data/sfz_technical_candidates.json docs/index.html docs/review-pool.html docs/review-rules.html docs/css/review-home.css docs/js/review-home.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Update independent routes and human review home'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Request Pages build for generated commit
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
