name: Read-only FinMind permission probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check existing dataset access without exposing credentials
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.parse
          token = os.environ.get("FINMIND_TOKEN", "")
          if not token:
              print("FINMIND_TOKEN is not configured")
              raise SystemExit(1)
          params = urllib.parse.urlencode(dict(dataset="TaiwanStockPriceAdj", data_id="2330", start_date="2026-09-03", end_date="2026-09-04"))
          req = urllib.request.Request("https://api.finmindtrade.com/api/v4/data?" + params, headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
                  rows = payload.get("data", [])
                  print(json.dumps({"http":response.status,"api_status":payload.get("status"),"row_count":len(rows),"dates":sorted(set(str(r.get("date")) for r in rows))}))
          except urllib.error.HTTPError as exc:
              print(json.dumps({"http":exc.code,"dataset":"TaiwanStockPriceAdj","access":"unavailable"}))
          except Exception as exc:
              print(json.dumps({"error_type":type(exc).__name__}))
              raise SystemExit(1)
