name: Daily Stock Site Update

on:
  schedule:
    # Taiwan market after close: 17:30 Taipei / 09:30 UTC, Monday-Friday.
    - cron: "30 9 * * 1-5"
    # Fallback retry: 20:30 Taipei / 12:30 UTC. If nothing changed, no commit is made.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the complete update without committing or deploying"
        required: false
        default: false
        type: boolean
      backfill_tdcc_holder_history:
        description: "One-time official TDCC six-week holder-history backfill"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-stock-site-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip requests
          python -m pip install -r requirements-v2.lock

      - name: Sync latest main before refresh
        if: github.ref == 'refs/heads/main'
        run: git pull --ff-only origin main

      - name: Refresh official listed and OTC stock prices
        env:
          V44_REFRESH_SCOPE: "all"
          V44_OFFICIAL_INITIAL_BACKFILL_DAYS: "75"
          V44_OFFICIAL_OVERLAP_DAYS: "7"
          ENABLE_FINMIND_AUX: "0"
        run: python refresh_prices.py

      - name: Update verified adjusted histories from official daily prices and actions
        run: python update_official_adjusted_history.py --data-dir data --cache-dir "${{ runner.temp }}/official-adjusted-cache"

      - name: Verify adjusted history pairs remain intact
        run: python verified_price_guard.py

      - name: Resolve the official common trading session
        id: session
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('data/official_adjusted_update_manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('date=' + payload['data_as_of'] + '\n')
          PY

      - name: Refresh verified two-market weekly holder sources and Top50
        run: python -m tools.update_weekly_sources --data-dir data --official-root .

      - name: Generate daily listed and OTC market flow
        run: python market_flow.py --strict --date "${{ steps.session.outputs.date }}"

      - name: Collect official attention and disposition risk
        run: python attention_disposition.py --date "${{ steps.session.outputs.date }}"

      - name: Backfill official TDCC six-week holder history
        if: ${{ inputs.backfill_tdcc_holder_history == true }}
        run: python tdcc_holder_history.py --limit 50

      - name: Generate weekly major-holder risers
        run: python weekly_holder_risers.py --limit 50

      - name: Generate independent routes and human review changes
        run: python build_review_data.py --as-of "${{ steps.session.outputs.date }}"

      - name: Restore official-only response cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/workspace-official
          key: workspace-official-${{ github.run_id }}
          restore-keys: workspace-official-

      - name: Update full institutional windows and monthly revenue
        run: python -m tools.refresh_workspace_data --cache "${{ runner.temp }}/workspace-official"

      - name: Generate static site
        run: python generate_site.py

      - name: Verify workspace dates, coverage and retired-rule removal
        run: python -m tools.verify_workspace

      - name: Commit and push generated site
        id: publish
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          test ! -e docs/.v2-staging
          test ! -e docs/.v2-previous
          git add docs/ data/ reports/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Auto update: $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build for the generated commit
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_pages_verified.py --repo "${{ github.repository }}" --docs-dir docs

      - name: Preserve update diagnostics
        if: failure() || inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-verification
          retention-days: 7
          path: |
            data/official_adjusted_update_manifest.json
            data/price_refresh_summary.json
            data/v2_build_status.json
            data/review_queue.json
            data/mda_weekly_top50.json
            data/official_stock_universe.json
            data/freshness_manifest.json
            docs/data/index.json
