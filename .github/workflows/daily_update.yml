name: Daily Stock Site Update

on:
  schedule:
    # Taiwan market after close: 17:30 Taipei / 09:30 UTC, Monday-Friday.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Refresh MDA full-market scan
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "$FINMIND_TOKEN" ]; then
            python mda_full_market_refresh.py --price-months 24
            python mda_full_market_refresh.py --skip-holding --one-day-price
            python mda_universe_scan.py
          else
            echo "::warning::FINMIND_TOKEN is not set; skip MDA full-market refresh."
          fi

      - name: Generate daily Top20 report
        run: python run_screener.py

      - name: Refresh latest Top20 stock data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          V44_FETCH_MONTHS: "24"
          V44_REFRESH_SCOPE: "latest"
        run: python refresh_prices.py

      - name: Generate static site
        run: python generate_site.py

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ reports/
          git diff --cached --quiet || git commit -m "Auto update: $(date '+%Y-%m-%d')"
          git push
