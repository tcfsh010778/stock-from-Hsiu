name: Daily Stock Site Update

on:
  schedule:
    # Taiwan market after close: 17:30 Taipei / 09:30 UTC, Monday-Friday.
    - cron: "30 9 * * 1-5"
    # Fallback retry: 20:30 Taipei / 12:30 UTC. If nothing changed, no commit is made.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-site-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - name: Refresh MDA full-market scan
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "$FINMIND_TOKEN" ]; then
            python mda_full_market_refresh.py --price-months 24
            python mda_full_market_refresh.py --skip-holding --one-day-price
            python mda_universe_scan.py
          else
            echo "::warning::FINMIND_TOKEN is not set; skip MDA full-market refresh."
          fi

      - name: Refresh industry category cache
        run: python tools/refresh_industry_cache.py

      - name: Generate daily Top20 report
        run: python run_screener.py

      - name: Generate market sentiment data
        run: python market_sentiment.py

      - name: Generate CaryBot signal bridge
        run: python carybot_signals.py

      - name: Refresh all-market stock prices
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          V44_FETCH_MONTHS: "24"
          V44_REFRESH_SCOPE: "all"
          V44_BULK_PRICE_DAYS: "21"
          V44_REFRESH_AUX_SCOPE: "latest"
        run: python refresh_prices.py

      - name: Generate static site
        run: python generate_site.py

      - name: Verify generated daily artifacts
        run: python tools/verify_daily_update_artifacts.py

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ reports/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Auto update: $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
