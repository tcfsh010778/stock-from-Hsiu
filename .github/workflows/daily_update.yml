name: Daily Stock Site Update

on:
  schedule:
    # Taiwan market after close: 17:30 Taipei / 09:30 UTC, Monday-Friday.
    - cron: "30 9 * * 1-5"
    # Fallback retry: 20:30 Taipei / 12:30 UTC. If nothing changed, no commit is made.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      rebuild_price_history:
        description: "One-time verified raw/adjusted history migration from 2024-04-01"
        required: false
        default: false
        type: boolean
      backfill_tdcc_holder_history:
        description: "One-time official TDCC six-week holder-history backfill"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-stock-site-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip requests
          python -m pip install -r requirements-v2.lock

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - name: Restore validated historical partitions
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stock-price-partitions
          key: official-price-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: official-price-v2-${{ runner.os }}-

      - name: Refresh official listed and OTC stock prices
        env:
          V44_REFRESH_SCOPE: "all"
          V44_OFFICIAL_INITIAL_BACKFILL_DAYS: "75"
          V44_OFFICIAL_OVERLAP_DAYS: "7"
          ENABLE_FINMIND_AUX: "0"
          REBUILD_HISTORY: ${{ inputs.rebuild_price_history }}
        run: |
          if [ "$REBUILD_HISTORY" = "true" ]; then
            python refresh_prices.py --rebuild-history --history-start 2024-04-01 --partition-cache "${{ runner.temp }}/stock-price-partitions"
          else
            python refresh_prices.py --partition-cache "${{ runner.temp }}/stock-price-partitions"
          fi

      - name: Refresh optional legacy FinMind auxiliary caches
        if: ${{ vars.ENABLE_FINMIND_AUX == '1' }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          test -n "$FINMIND_TOKEN"
          python mda_full_market_refresh.py --skip-price

      - name: Refresh MDA full-market scan from current caches
        run: python mda_universe_scan.py

      - name: Refresh industry category cache
        run: python tools/refresh_industry_cache.py

      - name: Generate daily Top20 report
        run: python run_screener.py

      - name: Generate market sentiment data
        run: python market_sentiment.py

      - name: Generate daily listed and OTC market flow
        run: python market_flow.py

      - name: Generate CaryBot signal bridge
        run: python carybot_signals.py

      - name: Generate backtest dashboard data
        run: python backtest_dashboard.py

      - name: Collect official attention and disposition risk
        run: python attention_disposition.py

      - name: Generate daily decision contract
        run: python daily_decisions.py

      - name: Archive official TDCC weekly holder aggregate
        run: python tdcc_holder_snapshot.py

      - name: Backfill official TDCC six-week holder history
        if: ${{ inputs.backfill_tdcc_holder_history == true }}
        run: python tdcc_holder_history.py --limit 50

      - name: Generate weekly major-holder risers
        run: python weekly_holder_risers.py --limit 50

      - name: Generate static site
        run: python generate_site.py

      - name: Generate public V2 parallel pages
        run: python generate_v2.py --validate --switch-navigation

      - name: Collect optional recent Volume Profile samples
        continue-on-error: true
        run: python tools/collect_volume_profile.py --symbol 2330.TW --symbol 6488.TWO --symbol 2317.TW --symbol 2353.TW

      - name: Verify generated daily artifacts
        run: python tools/verify_daily_update_artifacts.py

      - name: Verify V2 parallel release
        run: python tools/verify_v2_public.py --navigation switched

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ reports/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Auto update: $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Save resumable partitions after interrupted migration
        if: failure() && inputs.rebuild_price_history == true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/stock-price-partitions
          key: official-price-v2-${{ runner.os }}-${{ github.run_id }}
