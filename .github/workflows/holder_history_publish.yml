name: Publish Holder History

on:
  schedule:
    # Friday 21:30 Asia/Taipei (13:30 UTC).
    - cron: "30 13 * * 5"
    # Saturday 09:30 Asia/Taipei fallback if Friday TDCC data is delayed.
    - cron: "30 1 * * 6"
    # Sunday and Monday 09:30 Asia/Taipei fallbacks for a delayed TDCC release.
    - cron: "30 1 * * 0"
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-site-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip requests
          python -m pip install -r requirements-v2.lock

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Check official TDCC date and record the attempt
        id: holder_date
        env:
          HOLDER_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python holder_update_status.py

      - name: Archive official TDCC weekly holder aggregate
        if: steps.holder_date.outputs.update_required == 'true'
        run: python tdcc_holder_snapshot.py

      - name: Backfill latest official TDCC six-week history
        if: steps.holder_date.outputs.update_required == 'true'
        run: python tdcc_holder_history.py --limit 50

      - name: Generate latest complete six-week holder history
        if: steps.holder_date.outputs.update_required == 'true'
        run: python weekly_holder_risers.py --limit 50

      - name: Finalize successful holder publication record
        if: steps.holder_date.outputs.update_required == 'true'
        run: python holder_update_status.py --finalize

      - name: Refresh official daily holder and rolling institutional metrics
        if: steps.holder_date.outputs.update_required == 'true'
        run: python market_flow.py

      - name: Regenerate institutional ranking with rolling windows
        if: steps.holder_date.outputs.update_required == 'true'
        run: python generate_site.py --flow-only

      - name: Generate holder page and update record
        run: python generate_site.py --holder-only

      - name: Verify holder artifact
        run: |
          python -c "import json; p=json.load(open('data/weekly_holder_risers.json', encoding='utf-8')); assert len(p.get('weekly_dates') or []) == 6; assert 0 < p.get('row_count', 0) <= 50; assert p.get('six_week_complete_count') == p.get('row_count'); assert p.get('source_state') == 'tdcc_official'"
          python -c "import json; p=json.load(open('data/holder_update_status.json', encoding='utf-8')); assert p.get('last_checked_at'); assert p.get('state') in {'waiting_for_tdcc', 'published'}; assert p.get('attempts')"
          grep -q "回顧 6 週大戶股權變化" docs/holder-risers.html
          grep -q "資料更新至" docs/holder-risers.html
          grep -q "散戶賣出" docs/holder-risers.html
          grep -q "融資增減" docs/holder-risers.html
          grep -q "資券比" docs/holder-risers.html
          ! grep -q "yfinance" docs/holder-risers.html

      - name: Verify corrected page-specific columns
        if: steps.holder_date.outputs.update_required == 'true'
        run: |
          python -c "import json; p=json.load(open('data/daily_market_flow.json', encoding='utf-8')); h=json.load(open('data/weekly_holder_risers.json', encoding='utf-8')); r=(p.get('supplemental_data') or {}).get('retail_200', {}); assert p.get('schema_version') == '1.3.0'; assert p.get('institutional_history', {}).get('session_count') == 20; assert r.get('coverage_count', 0) > 0; assert r.get('date') == h.get('date'); assert p.get('supplemental_data', {}).get('holder_metric_count', 0) > 0"
          grep -q "5日" docs/institutional-flow.html
          grep -q "10日" docs/institutional-flow.html
          grep -q "20日" docs/institutional-flow.html
          grep -q "法人集中比" docs/institutional-flow.html

      - name: Commit and push holder pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holder_weekly_snapshots.json data/weekly_holder_risers.json data/holder_update_status.json data/daily_market_flow.json data/freshness_manifest.json docs/data/weekly_holder_risers.json docs/data/holder_update_status.json docs/data/daily_market_flow.json docs/data/freshness_manifest.json docs/holder-risers.html docs/institutional-flow.html docs/index.html
          if git diff --cached --quiet; then
            echo "No holder-history changes to commit."
            exit 0
          fi
          git commit -m "Update six-week holder history"
          git push
